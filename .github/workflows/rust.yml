name: Native Rust port
on:
  push:
    branches: [main]
    paths: ["rust/**", "src/**", "tests/**", "pyproject.toml", "uv.lock", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "src/**", "tests/**", "pyproject.toml", "uv.lock", ".github/workflows/rust.yml"]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: cargo doc --locked --no-deps
      - run: cargo build --locked --release
      - run: cargo run --locked --release -- quickstart --n-evals 5
      - run: cargo package --locked --allow-dirty
  minimum-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.85.1 --profile minimal --no-self-update
      - run: cargo +1.85.1 check --locked --all-targets
  python-parity:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.14"}
          - {os: ubuntu-latest, python: "3.15"}
          - {os: windows-latest, python: "3.15"}
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python -m pip install uv
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync --python ${{ matrix.python }} pytest tests -q
      - run: uv run --no-sync --python ${{ matrix.python }} python rust/tools/validate_python_parity.py --build
      - run: uv run --no-sync --python ${{ matrix.python }} python scripts/check_docs.py
