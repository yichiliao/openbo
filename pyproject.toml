[project]
name = "open-bo"
version = "0.1.0"
description = "Research and teaching library for OpenBO"
readme = "README.md"
authors = [
    { name = "yichiliao", email = "imetliao@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "botorch>=0.17.2",
    "gpytorch>=1.15.2",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "threadpoolctl>=3.6.0",
    "torch>=2.11.0; python_version < '3.15'",
    "torch>=2.14.0; python_version >= '3.15'",
    "tqdm>=4.67.3",
    "websockets>=16.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openbo"

# PyTorch publishes its Python 3.15 wheels on its own index, not PyPI.
# Keep this index explicit so all other packages still come from PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "python_version >= '3.15'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023"]

[tool.pytest.ini_options]
# `scripts/` is not a package; a few tests import from it (`from scripts.… import …`).
# The `pytest` console script (what `uv run pytest` runs) does not put the repo root on sys.path.
pythonpath = ["."]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
