# NAF / MetaBO (Volpp et al., ICLR 2020) in normalized [0, 1]^d. One session is one task.
# The objective is maximized; the client sends one value y per observation.
# Set up for the archived Goldstein-Price model (600 training iterations, one seed): tasks of
# MetaBO's Goldstein-Price family, s * g(x - t), with g the reference's log-normalized
# Goldstein-Price (scripts/train_naf.py --family goldstein_price).
# Run with: uv run python server_scripts/run_naf_server.py --config-path configs/server_optimizers/naf_server_goldstein_price.yaml
input_dim: 2
# Observations outside [min, max] are rejected. Goldstein-Price-family tasks stay inside about
# [-2.6, 3.5] (3050 tasks, 4000 random points each, and the corners). Values must be on the
# training family's scale: the AF reads the GP's raw mean and standard deviation.
y_range: [-3.5, 4.5]
# A scripts/train_naf.py output folder (read-only): <af_name>.pt and naf_config.json.
af_dir: benchmark_results/naf_goldstein_price/training/goldstein_price_metabo50_v1
af_name: best_af       # best_af (best training return, iteration 499) | af (last iteration)
# Evaluations per session when the start message omits n_iter. Leave unset (null) for the AF's
# training budget T (30 here); a session can never run longer than T.
n_iter_default: null
