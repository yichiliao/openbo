[package]
name = "openbo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Rust research and teaching library for Bayesian optimization"
license = "MIT"
repository = "https://github.com/yichiliao/openbo"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
statrs = "0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-tungstenite = "0.26"

[dev-dependencies]
tempfile = "3"

[lib]
name = "openbo"
path = "src/lib.rs"

[[bin]]
name = "openbo"
path = "src/main.rs"
